[workspace]
resolver = "3"
members = ["crates/graphersal-memory"]

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/graphersal/graphersal-memory"
homepage = "https://github.com/graphersal/graphersal-memory"
authors = ["Aleksandr Dederer"]

[workspace.dependencies]
# Command-line parsing of the product CLI (many subcommands with help text).
clap = { version = "4.5", features = ["derive"] }
# The graph engine and its MCP endpoint: exact crates.io pins (the engine's MCP and serving
# crates make no stability promise during 0.x, so every engine crate pins the same exact version).
graphersal = "=0.6.2"
graphersal-mcp = "=0.6.2"
# The session the MCP tools run on (its presets, its store attachment).
graphersal-session = "=0.6.2"
# The hosted graph runtime: the session thread, its job queue and the MCP host glue (`mcp`);
# the embedded playground (`ui-assets`) and the allow-list HTTP context of `graphersal-memory ui`.
graphersal-serve = { version = "=0.6.2", features = ["mcp", "ui-assets"] }
# JSON-RPC messages of the MCP stream (the project binding) and the product catalog; already in
# the tree through the engine crates.
serde_json = "1.0"
# The daemon's lock files (`daemon.pid`, `daemon.start.lock`): an OS advisory lock (`flock` on
# Unix, `LockFileEx` on Windows) that the OS releases when the process ends, also on a crash.
# Already in the tree through `graphersal` (persist: the Store's directory lock), the same
# version; `std::fs::File::lock` would need Rust 1.89, above the MSRV.
fd-lock = "4"
# AF_UNIX sockets on Windows (10 1803 and later), the shim <-> daemon transport; std offers
# them only on Unix (`std::os::unix::net`). Windows only.
uds_windows = "1.1"
# The embedding model download of `install` (the one network use of install: Hugging Face over
# HTTPS), copied from graphersal-cli's `embed-model download`: synchronous, pure Rust with rustls
# and the webpki roots, no system TLS, no async runtime; the same version graphersal-cli uses.
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
# SHA-256 (and the git blob SHA-1) of the downloaded model files; already in the tree as the
# crypto provider of rustls (through `ureq`), the same version: no new crate.
ring = "0.17"
# Reading opencode's past sessions: opencode 1.x keeps sessions, messages and parts in a SQLite
# database (`~/.local/share/opencode/opencode.db`, WAL mode); it is opened read-only. Bundled
# SQLite (a C file built with the C compiler `ring` already needs), so no system library is
# required on any release platform.
rusqlite = { version = "0.37", features = ["bundled"] }
# Reading Codex's `config.toml` (its MCP servers, the memories switch): TOML has inline tables,
# dotted and quoted keys and multi-line strings, which a hand-written reader would get wrong.
# Reading only: install edits the file as text (our managed tables and one value), so every
# other byte of the user's file is kept. No `display` (no TOML is written through it).
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
# The loopback HTTP server of `graphersal-memory ui` (the browser UI): synchronous, no async
# runtime, no TLS (127.0.0.1 only); the same crate and version Graphersal's own dev server
# (graphersal-cli) uses, so the engine's HTTP boundary types are converted the way they are
# tested there. graphersal-serve itself has no HTTP library on purpose.
tiny_http = "0.12"

[profile.release]
# One codegen unit, as the engine's own release builds use.
codegen-units = 1

# The prebuilt binaries of every GitHub Release (.github/workflows/release.yml): release code,
# whole-program LTO, symbols stripped. Panics keep unwinding (never `panic = "abort"`): the engine
# rolls an interrupted unit back while it unwinds, so a store keeps no half-applied change.
[profile.dist]
inherits = "release"
lto = "fat"
strip = true

[workspace.lints.rust]
# `deny`, not `forbid`: two Windows functions allow it (`shim::keep_std_handles_from_children`,
# a kernel32 call std offers only unstably, and `winshell::short_path`, `GetShortPathNameW`,
# which std does not offer). Every other `unsafe` is an error.
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
