[package]
name = "graphersal-memory"
description = "Local graph memory for AI coding agents: rules, decisions and past sessions, searchable through MCP."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["mcp", "memory", "agents", "graph", "claude"]
categories = ["command-line-utilities", "development-tools"]
# Not on crates.io: releases are GitHub Release binaries (.github/workflows/release.yml) and
# `cargo install --git`.
publish = false

[[bin]]
name = "graphersal-memory"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
graphersal = { workspace = true, features = ["persist", "script", "gql", "model2vec"] }
graphersal-mcp = { workspace = true }
graphersal-serve = { workspace = true }
graphersal-session = { workspace = true }
serde_json = { workspace = true }
fd-lock = { workspace = true }
ureq = { workspace = true }
ring = { workspace = true }

[target.'cfg(windows)'.dependencies]
uds_windows = { workspace = true }

[lints]
workspace = true
