[package]
name = "graphersal-memory"
description = "Local graph memory for AI coding agents: rules, decisions and past sessions, searchable through MCP."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "../../README.md"
documentation = "https://github.com/graphersal/graphersal-memory/tree/main/docs"
keywords = ["mcp", "memory", "agents", "graph", "claude"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "graphersal-memory"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
graphersal = { workspace = true, features = ["persist", "script", "gql", "model2vec"] }
graphersal-mcp = { workspace = true }
graphersal-serve = { workspace = true }
graphersal-session = { workspace = true }
serde_json = { workspace = true }
fd-lock = { workspace = true }
ureq = { workspace = true }
ring = { workspace = true }
rusqlite = { workspace = true }
toml = { workspace = true }
tiny_http = { workspace = true }

[target.'cfg(windows)'.dependencies]
uds_windows = { workspace = true }

# `cargo binstall graphersal-memory`: the release's archives (named by platform, not by target;
# Linux builds are static musl, so they serve the gnu targets too). Keep in step with the
# release workflow's matrix and `install::update::release_build`. Other targets: no release
# build, binstall falls back to building.
[package.metadata.binstall.overrides.x86_64-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-linux-x86_64.tar.gz"
bin-dir = "{ name }-v{ version }-linux-x86_64/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-linux-x86_64.tar.gz"
bin-dir = "{ name }-v{ version }-linux-x86_64/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.aarch64-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-linux-aarch64.tar.gz"
bin-dir = "{ name }-v{ version }-linux-aarch64/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-linux-aarch64.tar.gz"
bin-dir = "{ name }-v{ version }-linux-aarch64/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-macos-arm64.tar.gz"
bin-dir = "{ name }-v{ version }-macos-arm64/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-macos-x86_64.tar.gz"
bin-dir = "{ name }-v{ version }-macos-x86_64/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-windows-x86_64.zip"
bin-dir = "{ name }-v{ version }-windows-x86_64/{ bin }{ binary-ext }"
pkg-fmt = "zip"

[lints]
workspace = true
